<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Tótem Getnet IM30</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">🛒 Tótem Getnet</div>
    <div class="topbar-right">
      <span id="mode-badge" class="badge">…</span>
      <span id="clock" class="clock"></span>
    </div>
  </header>

  <main id="app">

    <!-- Atractor / idle -->
    <section id="screen-attractor" class="screen active attractor">
      <div class="attractor-inner">
        <div class="attractor-logo">💳</div>
        <h1>Tótem de Autoatención</h1>
        <p class="pulse">Toque la pantalla para comenzar</p>
        <p class="muted">Paga con tarjeta en el terminal PAX IM30</p>
      </div>
    </section>

    <!-- Catálogo -->
    <section id="screen-catalog" class="screen">
      <div class="catalog-layout">
        <div class="catalog-main">
          <div id="category-tabs" class="category-tabs"></div>
          <div id="product-grid" class="product-grid"></div>
        </div>
        <aside class="cart-panel">
          <h2>Tu pedido</h2>
          <div id="cart-items" class="cart-items"><p class="muted">Carrito vacío</p></div>
          <div class="cart-total">
            <span>Total</span>
            <strong id="cart-total">$0</strong>
          </div>
          <div class="cart-actions">
            <button id="btn-clear" class="btn ghost">Vaciar</button>
            <button id="btn-pay" class="btn primary" disabled>Pagar</button>
          </div>
          <button id="btn-history" class="btn link">Historial de ventas</button>
        </aside>
      </div>
    </section>

    <!-- Pago en curso -->
    <section id="screen-payment" class="screen payment">
      <div class="payment-inner">
        <div class="spinner"></div>
        <h1>Acerque o inserte su tarjeta</h1>
        <p id="payment-amount" class="payment-amount">$0</p>
        <p class="muted">Use el terminal PAX IM30 para completar el pago</p>
        <button id="btn-cancel" class="btn danger">Cancelar</button>
      </div>
    </section>

    <!-- Resultado -->
    <section id="screen-result" class="screen result">
      <div class="result-inner">
        <div id="result-icon" class="result-icon">✅</div>
        <h1 id="result-title">Pago aprobado</h1>
        <p id="result-message" class="muted"></p>
        <div class="result-actions">
          <button id="btn-receipt" class="btn primary">Ver comprobante</button>
          <button id="btn-retry" class="btn ghost hidden">Reintentar</button>
          <button id="btn-home" class="btn ghost">Nueva venta</button>
        </div>
      </div>
    </section>

    <!-- Comprobante -->
    <section id="screen-receipt" class="screen receipt">
      <div class="receipt-toolbar">
        <button id="btn-back-result" class="btn ghost">← Volver</button>
        <div>
          <button id="btn-download-pdf" class="btn primary">Descargar PDF</button>
          <button id="btn-new-sale" class="btn ghost">Nueva venta</button>
        </div>
      </div>
      <iframe id="receipt-frame" title="Comprobante"></iframe>
    </section>

    <!-- Historial -->
    <section id="screen-history" class="screen history">
      <div class="receipt-toolbar">
        <button id="btn-history-back" class="btn ghost">← Volver</button>
        <h2>Historial de ventas</h2>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/app.js"></script>
</body>
</html>
