<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0, user-scalable=no">
  <title>Tótem de Autoatención — Carrito de Compras</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Encabezado principal -->
  <header id="app-header">
    <div class="header-contenido">
      <div class="header-izquierda">
        <svg class="header-icono" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <h1 class="header-titulo">Tótem de Autoatención</h1>
      </div>
      <div class="header-derecha">
        <span class="carrito-badge" id="contador-carrito">0</span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/>
          <circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
      </div>
    </div>
  </header>

  <!-- Contenedor principal: grilla + carrito -->
  <main id="contenedor-principal">
    <!-- Grilla de productos (60%) -->
    <section id="grilla-productos" aria-label="Catálogo de productos">
      <!-- Las tarjetas se renderizan dinámicamente -->
    </section>

    <!-- Panel del carrito (40%) -->
    <aside id="panel-carrito">
      <div class="panel-sticky">
        <div class="panel-header">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <h2 class="panel-titulo">Tu Carrito</h2>
        </div>

        <div id="lista-carrito" class="lista-carrito">
          <!-- Los ítems del carrito se renderizan dinámicamente -->
          <div class="carrito-vacio">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"/>
              <circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <p class="carrito-vacio-texto">Tu carrito está vacío</p>
          </div>
        </div>

        <div id="subtotal-carrito" class="subtotal-carrito">
          <span class="subtotal-label">Subtotal</span>
          <span class="subtotal-valor" id="total-general-carrito">$0</span>
        </div>

        <div class="panel-acciones">
          <button id="btn-limpiar" class="btn btn-secundario" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              <line x1="10" y1="11" x2="10" y2="17"/>
              <line x1="14" y1="11" x2="14" y2="17"/>
            </svg>
            Limpiar carrito
          </button>
          <button id="btn-confirmar" class="btn btn-primario" type="button" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            Confirmar compra
          </button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Modal de resumen de compra -->
  <div id="modal-overlay" class="modal-overlay">
    <div id="modal-contenido" class="modal-contenido" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <div class="modal-header">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <h2 id="modal-titulo" class="modal-titulo">Resumen de tu compra</h2>
      </div>
      <div class="modal-cuerpo" id="modal-cuerpo">
        <!-- Tabla de resumen se genera dinámicamente -->
      </div>
      <div class="modal-footer">
        <p class="modal-pregunta">¿Deseas confirmar tu compra?</p>
        <div class="modal-botones">
          <button id="modal-btn-cancelar" class="btn btn-outline" type="button">Cancelar</button>
          <button id="modal-btn-confirmar" class="btn btn-primario" type="button">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor de toasts -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Scripts en orden de dependencia -->
  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
